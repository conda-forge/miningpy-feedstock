{% set name = "miningpy" %}
{% set version = "0.6.3" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 4fe01a182591fd60dbba1552c8d51935cdaf3742ed1e1083163d92bb7d465a7c

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - ezdxf >=0.13.1
    - numpy >=1.19.0
    - pandas >=1.0
    - python >={{ python_min }}
    - pyvista >=0.32,!=0.35.2
    - pyvistaqt
    - pyqt
    - vtk >=9.1.0
    - matplotlib-base

test:
  requires:
    - python {{ python_min }}
  imports:
    - miningpy

about:
  home: https://pypi.org/project/miningpy/
  summary: python tools for mining engineering
  license: MIT
  license_file: LICENSE
  dev_url: https://bitbucket.org/incitron/miningpy
  doc_url: https://miningpy.readthedocs.io

extra:
  recipe-maintainers:
    - iainfullelove
